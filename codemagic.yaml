workflows:
  android-workflow:
    name: SetuLingo Android Build & Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      java: 17
      groups:
        # Define these variable groups in Codemagic UI:
        # - keystore_credentials: CM_KEYSTORE (base64), CM_KEYSTORE_PASSWORD, CM_KEY_ALIAS, CM_KEY_PASSWORD
        # - google_play_credentials: GPLAY_SERVICE_ACCOUNT_CREDENTIALS (optional, for Play Store upload)
        - keystore_credentials
      vars:
        PACKAGE_NAME: "com.setulingo.app"
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Set up local.properties
        script: |
          echo "flutter.sdk=$HOME/programs/flutter" > "$CM_BUILD_DIR/android/local.properties"
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Verify Dart formatting
        script: |
          dart format --output=none --set-exit-if-changed .
      - name: Run Flutter static analysis
        script: |
          flutter analyze
      - name: Run unit and widget tests
        script: |
          flutter test
      - name: Build Debug APK
        script: |
          flutter build apk --debug
      - name: Set up Android release signing
        script: |
          if [ -n "$CM_KEYSTORE" ]; then
            echo "$CM_KEYSTORE" | base64 --decode > "$CM_BUILD_DIR/android/app/upload-keystore.jks"
            cat <<EOF > "$CM_BUILD_DIR/android/key.properties"
          storePassword=$CM_KEYSTORE_PASSWORD
          keyPassword=$CM_KEY_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF
          else
            echo "CM_KEYSTORE is not set. Release build will fall back to debug signing."
          fi
      - name: Build Release APK
        script: |
          flutter build apk --release
      - name: Build Release App Bundle (AAB)
        script: |
          flutter build appbundle --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      - build/app/outputs/bundle/release/*.aab
      - flutter_drive.log
    publishing:
      email:
        recipients:
          - team@setulingo.app
        notify:
          success: true
          failure: true
      # Optional Google Play deployment (uncomment when GPLAY_SERVICE_ACCOUNT_CREDENTIALS is configured):
      # google_play:
      #   credentials: $GPLAY_SERVICE_ACCOUNT_CREDENTIALS
      #   track: internal
      #   submit_as_draft: true
