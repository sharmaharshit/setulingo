workflows:
  android-workflow:
    name: SetuLingo Android Build & Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      java: 17
      groups:
        - keystore_credentials
      vars:
        PACKAGE_NAME: "com.setulingo.app"
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Set up local.properties
        script: |
          mkdir -p android
          FLUTTER_SDK_PATH="${FLUTTER_ROOT:-$(dirname $(dirname $(which flutter)))}"
          echo "flutter.sdk=$FLUTTER_SDK_PATH" > android/local.properties
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Format Dart code
        script: |
          dart format .
      - name: Run Flutter static analysis
        script: |
          flutter analyze
      - name: Run unit and widget tests
        script: |
          flutter test
      - name: Build Debug APK
        script: |
          flutter build apk --debug
      - name: Set up Android release signing
        script: |
          if [ -n "$CM_KEYSTORE" ]; then
            echo "$CM_KEYSTORE" | base64 --decode > android/app/upload-keystore.jks
            cat <<EOF > android/key.properties
          storePassword=$CM_KEYSTORE_PASSWORD
          keyPassword=$CM_KEY_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF
          else
            echo "CM_KEYSTORE is not set. Release build will fall back to debug signing."
          fi
      - name: Build Release APK
        script: |
          flutter build apk --release
      - name: Build Release App Bundle (AAB)
        script: |
          flutter build appbundle --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      - build/app/outputs/bundle/release/*.aab
      - flutter_drive.log
    publishing:
      email:
        recipients:
          - team@setulingo.app
        notify:
          success: true
          failure: true
