workflows:
  setulingo-android-debug:
    name: SetuLingo Android Debug APK
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
    scripts:
      - name: Verify source layout
        script: |
          set -e
          for f in lib/main.dart lib/main_v2.dart lib/v2/content.dart lib/v2/store.dart lib/v2/widgets.dart lib/v2/pages.dart lib/v2/lesson_page.dart lib/v2/profile_settings.dart lib/v2/search_page.dart lib/v2/learning_path.dart lib/v2/grammar_content.dart lib/v2/quiz_page.dart lib/v2/sentence_lab_vocab.dart lib/v2/auth_page.dart; do
            test -f "$f" || { echo "MISSING: $f"; exit 1; }
          done
          echo "All SetuLingo source files are in place."
      - name: Ensure audio assets folder exists
        script: |
          mkdir -p assets/audio
          touch assets/audio/.gitkeep
      - name: Generate Android platform files
        script: |
          set -e
          if [ ! -f android/gradlew ] && [ ! -f android/gradlew.bat ]; then
            flutter create --platforms=android --org com.setulingo .
          fi
      - name: Install Flutter dependencies
        script: flutter pub get
      - name: Analyze Flutter project
        script: flutter analyze
      - name: Build Android debug APK
        script: flutter build apk --debug -t lib/main.dart
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
