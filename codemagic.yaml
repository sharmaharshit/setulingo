workflows:
  setulingo-android-debug:
    name: SetuLingo Android Debug APK
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      flutter: stable

    scripts:
      - name: Create modern Android platform
        script: |
          rm -rf android
          flutter create --platforms=android --org com.setulingo .
          rm -rf test

      - name: Install Flutter dependencies
        script: |
          flutter pub get

      - name: Analyze Flutter project
        script: |
          flutter analyze

      - name: Build Android debug APK
        script: |
          flutter build apk --debug

    artifacts:
      - build/app/outputs/flutter-apk/*.apk
